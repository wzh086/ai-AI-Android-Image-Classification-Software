## ============================================================================
##  文件：local.properties（本机环境路径，不要提交到 Git）
##  作用：告诉 Gradle 这台电脑的 Android SDK 装在哪个目录。
##  怎么用：换电脑后如果 Android Studio 报 "SDK location not found"，
##          把下面这行改成你自己电脑的 SDK 路径即可（冒号与反斜杠要转义）。
##          用 Android Studio 打开工程时，它一般会自动帮你写好这一行。
## ============================================================================

sdk.dir=D\:\\pss\\ad\\Sdk
