# ============================================================================
#  文件：gradle.properties（Gradle 全局开关）
#  作用：配置构建时的 JVM 内存、AndroidX 支持等开关。
#  怎么用：构建报"内存不足 / OutOfMemory"就把 -Xmx 调大；其它项一般不用动。
# ============================================================================

# Gradle 守护进程的 JVM 参数。
# -Xmx2048m：最多使用 2048MB 内存；
# -Dfile.encoding=UTF-8：统一用 UTF-8 编码，避免中文注释、中文字符串乱码。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 允许并行构建多个模块，加快编译速度。
org.gradle.parallel=true

# 是否复用上一次的构建产物缓存（这里关闭，让每次编译行为可预期）。
org.gradle.caching=false

# 是否开启配置缓存（关闭它可以让 Android Studio 的布局预览更稳定）。
org.gradle.configuration-cache=false

# 使用 AndroidX 库，必须为 true，否则 appcompat / material 等库无法使用。
android.useAndroidX=true

# 非传递 R 类：每个模块只生成自己的资源 ID，编译更快、安装包更小。
android.nonTransitiveRClass=true
